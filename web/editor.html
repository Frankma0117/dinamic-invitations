<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f3ee">
  <title>Editor de invitaciones</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
  <link rel="stylesheet" href="/css/editor.css">
  <script type="module" src="/js/editor.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/panel" aria-label="Volver a mis invitaciones" title="Mis invitaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </a>
    <div class="doc">
      <input id="evTitle" class="doc-title" aria-label="Nombre de la invitación" maxlength="120">
      <span id="saveState" class="save-state" role="status"></span>
    </div>
    <div class="top-actions">
      <a id="openLink" class="btn ghost hide-sm" target="_blank" rel="noopener">Ver invitación ↗</a>
      <button id="shareBtn" class="btn primary" type="button">Compartir</button>
    </div>
  </header>

  <div class="shell">
    <nav class="tabs" id="tabs" aria-label="Secciones del editor"></nav>
    <main class="pane" id="pane" tabindex="-1"><div class="pane-in" id="panel"><p class="muted">Cargando…</p></div></main>
    <section class="preview" id="preview" aria-label="Vista previa">
      <div class="pv-bar" id="pbar"></div>
      <div class="phone-box" id="phoneBox">
        <div class="phone" id="phone"><iframe id="frame" title="Vista previa de la invitación"></iframe></div>
      </div>
    </section>
  </div>

  <button class="fab" id="fab" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
    Vista previa
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
