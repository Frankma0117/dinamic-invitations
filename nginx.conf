# nginx DENTRO del contenedor. El nginx del servidor (HTTPS) le reenvía a 127.0.0.1:5700.
map $uri $cache_control {
    ~^/assets/   "public, max-age=604800";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;          # /laura-gomez → /laura-gomez/ sin cambiar de dominio ni puerto
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /editor/ { add_header X-Robots-Tag "noindex, nofollow" always; add_header Cache-Control "no-cache" always; try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;     # un enlace mal copiado abre la invitación general
}
