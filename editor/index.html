<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor de invitaciones</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/editor.css">
  <script type="module" src="../js/editor.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../assets/favicon.svg" alt="" width="28" height="28"> Editor de invitaciones</div>
    <nav class="actions" id="actions" aria-label="Acciones"></nav>
  </header>
  <div class="layout">
    <aside class="panel" id="panel" aria-label="Configuración"><p class="muted pad">Cargando…</p></aside>
    <section class="preview" id="preview" aria-label="Vista previa">
      <div class="preview-bar" id="pbar"></div>
      <div class="phone-box" id="phoneBox"><div class="phone" id="phone"><iframe id="frame" title="Vista previa de la invitación"></iframe></div></div>
    </section>
  </div>
  <button class="fab" id="fab" type="button">👁 Vista previa</button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
